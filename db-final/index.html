<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COP4710 Database Final - Practice Exam</title>
<script>

<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a22;
    --panel-2: #1d2230;
    --text: #e6e8ee;
    --muted: #9aa3b2;
    --accent: #6aa9ff;
    --good: #3ddc84;
    --bad: #ff6b6b;
    --warn: #ffb84d;
    --border: #2a2f3d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    background: var(--bg); color: var(--text); line-height: 1.55;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(180deg, #0f1115 0%, rgba(15,17,21,0.92) 100%);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: 0.3px; }
  header .meta { color: var(--muted); font-size: 13px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
    transition: 0.15s; font-weight: 500;
  }
  .btn:hover { background: #262c3d; border-color: #3a4156; }
  .btn-primary { background: var(--accent); color: #0a1322; border-color: var(--accent); }
  .btn-primary:hover { background: #82b8ff; }
  .btn-good { background: var(--good); color: #0a1f12; border-color: var(--good); }
  .btn-warn { background: var(--warn); color: #2a1c00; border-color: var(--warn); }
  main { max-width: 920px; margin: 0 auto; padding: 24px; }
  .summary {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 20px; margin-bottom: 20px;
  }
  .summary p { margin: 4px 0; color: var(--muted); font-size: 14px; }
  .progress {
    height: 8px; background: var(--panel-2); border-radius: 999px; overflow: hidden; margin-top: 10px;
  }
  .progress > div { height: 100%; background: var(--accent); width: 0%; transition: 0.3s; }
  .section-header {
    margin: 28px 0 12px; padding: 8px 0; border-bottom: 2px solid var(--border);
    font-size: 14px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted);
  }
  .q {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px; margin-bottom: 16px;
  }
  .q.correct { border-color: var(--good); box-shadow: 0 0 0 1px rgba(61,220,132,0.18); }
  .q.incorrect { border-color: var(--bad); box-shadow: 0 0 0 1px rgba(255,107,107,0.18); }
  .q-head {
    display: flex; gap: 12px; align-items: baseline; margin-bottom: 10px;
  }
  .q-num {
    background: var(--panel-2); color: var(--muted); padding: 3px 10px; border-radius: 6px;
    font-size: 12px; font-weight: 600; flex-shrink: 0;
  }
  .q-type {
    font-size: 11px; text-transform: uppercase; color: var(--muted);
    letter-spacing: 1.1px; flex-shrink: 0;
  }
  .q-stem { white-space: pre-wrap; }
  .options { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    cursor: pointer; transition: 0.12s;
  }
  .opt:hover { background: #1f2433; }
  .opt input { margin-top: 4px; accent-color: var(--accent); }
  .opt.correct { background: rgba(61,220,132,0.10); border-color: var(--good); }
  .opt.wrong   { background: rgba(255,107,107,0.10); border-color: var(--bad); }
  .opt-letter { font-weight: 700; color: var(--accent); flex-shrink: 0; min-width: 18px; }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .answer-box {
    margin-top: 12px; padding: 14px 16px;
    background: #14211a; border: 1px solid #2c4a39; border-radius: 8px;
    font-size: 14px; display: none; white-space: pre-wrap;
  }
  .answer-box.show { display: block; }
  .answer-box .label {
    text-transform: uppercase; font-size: 11px; letter-spacing: 1.2px;
    color: var(--good); font-weight: 700; margin-bottom: 6px;
  }
  .ref { color: var(--muted); font-size: 12px; margin-top: 8px; }
  textarea {
    width: 100%; min-height: 100px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    font-family: inherit; font-size: 14px; resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .feedback { margin-top: 10px; font-size: 13px; font-weight: 600; }
  .feedback.ok  { color: var(--good); }
  .feedback.bad { color: var(--bad); }
  .footer-actions {
    margin: 32px 0 64px; padding: 20px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; text-align: center;
  }
  .footer-actions .btn { margin: 4px; padding: 10px 18px; font-size: 14px; }
  .filter-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel-2); padding: 4px 10px; border-radius: 999px;
    font-size: 12px; color: var(--muted); cursor: pointer; border: 1px solid var(--border);
  }
  .filter-chip.active { background: var(--accent); color: #0a1322; border-color: var(--accent); }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }

  /* Mobile */
  @media (max-width: 720px) {
    header { padding: 10px 12px; gap: 10px; }
    header h1 { font-size: 15px; line-height: 1.3; }
    header .meta { font-size: 12px; }
    .toolbar { width: 100%; gap: 6px; }
    .toolbar .btn { flex: 1 1 auto; padding: 10px 8px; font-size: 13px; }
    main { padding: 14px 12px; }
    .summary { padding: 12px 14px; border-radius: 10px; }
    .summary p { font-size: 13px; }
    .q { padding: 14px; border-radius: 10px; }
    .q-head { gap: 8px; flex-wrap: wrap; }
    .q-stem { font-size: 15px; }
    .opt { padding: 14px 12px; font-size: 15px; min-height: 48px; align-items: center; }
    .opt input { transform: scale(1.25); margin-right: 4px; }
    .actions { gap: 6px; }
    .actions .btn { flex: 1 1 auto; padding: 11px 10px; font-size: 13px; min-height: 44px; }
    textarea { font-size: 16px; min-height: 140px; } /* 16px prevents iOS zoom on focus */
    .footer-actions { padding: 14px; }
    .footer-actions .btn { display: block; width: 100%; margin: 6px 0; padding: 14px; font-size: 14px; }
    .filter-chip { padding: 8px 14px; font-size: 13px; min-height: 36px; }
    .answer-box { padding: 12px; font-size: 14px; }
    .section-header { font-size: 12px; margin: 20px 0 10px; }
  }

  @media (max-width: 380px) {
    .q-stem { font-size: 14px; }
    .toolbar .btn, .filter-chip { font-size: 12px; }
  }
</style>
</head>

  <div>
    <h1>COP4710 — Database Final Practice Exam</h1>
    <div class="meta"><span id="counts"></span></div>

    <span class="filter-chip active" data-filter="all">All</span>

<main>

    <p>This is the consolidated practice set (Quizzes 1, 2, and 3) for the COP4710 final exam.</p>

    <p id="score" style="color: var(--text); font-weight: 600; margin-top: 8px;"></p>
    <div class="progress"><div id="progressBar"></div></div>

  <div class="footer-actions">
    <button class="btn btn-primary" onclick="gradeAll()">Grade All Questions</button>

    <button class="btn" onclick="hideAll()">Hide All Answers</button>
    <button class="btn btn-warn" onclick="resetAll()">Reset Everything</button>
  </div>
</main>

<script>
const QUESTIONS = [{"type": "mc", "stem": "A DBMS buffer manager is responsible for which of the following tasks?", "options": ["Organizing records into a heap file.", "Identifying the disk address of a page using a record id (rid).", "Fetching pages from disk into main memory for processing.", "Applying a hash function to a search key to find a bucket."], "correct": "C", "reference": "[Page (275)]"}, {"type": "mc", "stem": "When is an index considered \"clustered\"?", "options": ["When the index is built on a primary key.", "When the data entries are (k, rid) pairs and the data file is unordered.", "When the ordering of data records is the same as or close to the ordering of data entries in the index.", "When the index uses a hash-based structure rather than a tree-based structure."], "correct": "C", "reference": "[Page (277)]"}, {"type": "mc", "stem": "In a tree-structured index (B+ Tree), what is the primary purpose of the \"doubly-linked list\" at the leaf level?", "options": ["To connect the root node to the leaf nodes.", "To allow the buffer manager to pin pages more efficiently.", "To facilitate the retrieval of qualifying entries during a range search.", "To store overflow records that do not fit in the primary bucket."], "correct": "C", "reference": "[Page (281)]"}, {"type": "mc", "stem": "Using the textbook’s cost model, if B is the number of data pages and D is the I/O time, what is the approximate cost of an Equality Search on a Heap File if the field is NOT a candidate key?", "options": ["0.5 B D", "D log 2 ⁡ B", "B D", "H + D"], "correct": "C", "reference": "[Page (284)]"}, {"type": "mc", "stem": "For a Sorted File, what is the I/O cost to perform an Equality Search on the search key?", "options": ["D log F ⁡ 1.5 B", "D log 2 ⁡ B", "B D", "2 D"], "correct": "B", "reference": "[Page (285)]"}, {"type": "mc", "stem": "Why is the cost of an Insert operation in a Sorted File calculated as \"Search Cost + BD \"?", "options": ["Because the index must be re-hashed.", "Because a new page must be allocated by the disk space manager.", "Because on average, half the file must be read and written back to maintain order.", "Because tree-based indexes require a root-to-leaf path traversal."], "correct": "C", "reference": "[Page (286)]"}, {"type": "mc", "stem": "In the context of unclustered indexes, what is the \"rule of thumb\" regarding range selections?", "options": ["If more than 10% of records qualify, it is often cheaper to scan and sort the file than use the index.", "Hash indexes are always superior to tree indexes for range selections.", "Range selections should only be performed on primary keys.", "Unclustered indexes are always faster than clustered indexes for large ranges."], "correct": "A", "reference": "[Page (289)]"}, {"type": "mc", "stem": "What is the I/O cost of an Equality Search using an Unclustered Hash Index?", "options": ["D ( 1 + log F ⁡ 0.15 B )", "B D", "2 D (assuming 1 I/O for the index page and 1 I/O for the data page)", "H + D"], "correct": "C", "reference": "[Page (291) - Table]"}, {"type": "mc", "stem": "Which file organization is generally the least efficient for \"Range Searches\"?", "options": ["Sorted File", "Clustered Index", "Heap File", "Tree-based Index"], "correct": "C", "reference": "[Page (291) - Table]"}, {"type": "mc", "stem": "You are designing a database for a company with 1,000,000 records. Each page holds 100 records ( R = 100 ) (R = 100) , so the number of data pages is B = 10,000 B = 10{,}000 . A B+ Tree index is built with fan-out F = 100 F = 100 . Using the I/O cost model from database systems (Chapter 8), what is the approximate difference in I/O cost between finding a single record using a Heap File scan versus a Clustered B+ Tree Index ?", "options": ["Heap File: 10,000 I/Os, B+ Tree: 3 I/Os → Difference ≈ 9,997 I/Os", "Heap File: 5,000 I/Os, B+ Tree: 2 I/Os → Difference ≈ 4,998 I/Os", "Heap File: 10,000 I/Os, B+ Tree: 100 I/Os → Difference ≈ 9,900 I/Os", "Heap File: 100 I/Os, B+ Tree: 3 I/Os → Difference ≈ 97 I/Os"], "correct": "B", "reference": null}, {"type": "mc", "stem": "In the context of ACID properties, which property ensures that if a transaction's actions are interrupted by a system crash, the partial effects are undone?", "options": ["Consistency", "Isolation", "Atomicity", "Durability"], "correct": "C", "reference": "[Page 522]"}, {"type": "mc", "stem": "A \"Dirty Read\" (WR conflict) occurs when:", "options": ["Transaction T2 reads an object that has been modified by T1 , but T1 has not yet committed.", "Transaction T1 reads an object, and T2 modifies it before T1 can read it again.", "Two transactions attempt to write to the same object simultaneously.", "A transaction reads a set of rows, and another transaction inserts a new row that fits the search criteria."], "correct": "A", "reference": "[Page 527]"}, {"type": "mc", "stem": "What is the primary difference between a \"Serial\" schedule and a \"Serializable\" schedule?", "options": ["A serial schedule allows interleaving; a serializable schedule does not.", "A serializable schedule is guaranteed to produce the same result as some serial execution of the transactions.", "Serial schedules are only used in distributed databases.", "A serializable schedule must follow the exact order in which transactions were submitted."], "correct": "B", "reference": "[Page 525]"}, {"type": "mc", "stem": "Under the Strict Two-Phase Locking (Strict 2PL) protocol, when are the locks held by a transaction released?", "options": ["Immediately after the specific data object is read or written.", "When the transaction moves from the \"growing\" phase to the \"shrinking\" phase.", "Only after the transaction has either committed or aborted.", "When another transaction requests a conflicting lock on the same object."], "correct": "C", "reference": "[Page 531]"}, {"type": "mc", "stem": "Which anomaly is described as \"a transaction T1 reads an object, then T2 overwrites it, and T1 reads the same object again only to find a different value\"?", "options": ["Dirty Read", "Unrepeatable Read", "Phantom Problem", "Overwriting Uncommitted Data"], "correct": "B", "reference": "[Page 527]"}, {"type": "mc", "stem": "The \"Write-Ahead Logging\" (WAL) protocol requires that:", "options": ["All log records for a transaction must be written to disk before the corresponding data pages are written to disk.", "The database must be locked entirely while writing the log.", "The log should only be written after the transaction has successfully committed.", "Transactions must wait for a checkpoint before performing any writes."], "correct": "A", "reference": "[Page 538]"}, {"type": "mc", "stem": "In transaction management, what is a \"Deadlock\"?", "options": ["A state where a transaction is waiting for a disk I/O to complete.", "A cycle of transactions where each is waiting for a lock held by another in the cycle.", "When the buffer manager runs out of available pages.", "When a transaction is aborted due to a violation of integrity constraints."], "correct": "B", "reference": "[Page 533]"}, {"type": "mc", "stem": "The \"Durability\" property of a DBMS is typically guaranteed by which component?", "options": ["The Query Optimizer", "The Recovery Manager (using the Log)", "The Lock Manager", "The Index Manager"], "correct": "B", "reference": "[Page 522]"}, {"type": "mc", "stem": "Which of the following is true regarding \"Aborted\" transactions?", "options": ["They are ignored by the system and their changes remain in the DB.", "The DBMS must ensure their effects are not visible to other transactions (Atomicity).", "They are automatically restarted by the user, not the DBMS.", "They only occur during hardware failures."], "correct": "B", "reference": "[Page 529]"}, {"type": "mc", "stem": "You are given the following schedule S S S involving two transactions T 1 T1 and T 2 T2 : R ( X ) R(X) : Read object X X W ( X ) W(X) : Write object X X Commit: Finalize transaction Schedule S S S : T 1 : R ( A ) T1: R(A) T 2 : R ( A ) T2: R(A) T 1 : W ( A ) T1: W(A) T 2 : W ( A ) T2: W(A) T 1 : Commit T1: \\text{Commit} T 2 : Commit T2: \\text{Commit} Which of the following statements is correct ?", "options": ["There is only a RW conflict; the schedule is conflict serializable.", "There is a WW conflict and a RW conflict; the schedule is not conflict serializable.", "There is only a WW conflict; the schedule is conflict serializable.", "There are no conflicts; the schedule is conflict serializable."], "correct": "B", "reference": "[Page 526] (Anomalies) and [Page 531] (Locking)."}, {"type": "mc", "stem": "Which of the following best describes a Functional Dependency ( F D ) X → Y ?", "options": ["If two tuples agree on the values in attributes Y , they must agree on attributes X .", "If two tuples agree on the values in attributes X , they must agree on attributes Y .", "For every value of X , there is exactly one value of Y in the entire database.", "X and Y must both be candidate keys for the relation."], "correct": "B", "reference": "[Page 607]"}, {"type": "mc", "stem": "A relation R is in Third Normal Form (3NF) if, for every non-trivial F D X → A in R :", "options": ["X is a superkey or A is part of some candidate key.", "X is a superkey and A is a primary attribute.", "R is already in BCNF.", "There are no transitive dependencies, regardless of whether X is a key."], "correct": "A", "reference": "[Page 615]"}, {"type": "mc", "stem": "What is the primary advantage of 3NF over Boyce-Codd Normal Form (BCNF)?", "options": ["3NF always eliminates all redundancy.", "3NF is easier to implement in SQL.", "3NF guarantees that all functional dependencies can be preserved during decomposition.", "3NF does not require the identification of candidate keys."], "correct": "C", "reference": "[Page 623]"}, {"type": "mc", "stem": "A decomposition of relation R into R1 and R2 is \"Lossless-Join\" if:", "options": ["R 1 ∩ R 2 is empty.", "R 1 ∪ R 2 contains all attributes of R .", "The common attributes ( R 1 ∩ R 2 ) form a candidate key for at least one of the new relations.", "All data from the original relation is stored in R1 ."], "correct": "C", "reference": "[Page 620]"}, {"type": "mc", "stem": "What does \"Dependency Preservation\" mean in the context of decomposition?", "options": ["All original FDs can be checked by looking at individual relations without performing a join.", "No data is lost when joining the decomposed relations.", "Primary keys are never changed during normalization.", "The number of dependencies remains constant before and after decomposition."], "correct": "A", "reference": "[Page 622]"}, {"type": "mc", "stem": "Which anomaly occurs when we cannot represent certain information (e.g., a new course) because the primary key (e.g., student ID) is not yet available?", "options": ["Update Anomaly", "Deletion Anomaly", "Insertion Anomaly", "Redundancy Anomaly"], "correct": "C", "reference": "[Page 609]"}, {"type": "mc", "stem": "According to Armstrong's Axioms, if X → Y and Y → Z , then X → Z . This is known as:", "options": ["Reflexivity", "Augmentation", "Transitivity", "Decomposition"], "correct": "C", "reference": "[Page 611]"}, {"type": "mc", "stem": "A Multivalued Dependency (MVD) is specifically addressed by which Normal Form?", "options": ["2NF", "3NF", "BCNF", "4NF"], "correct": "D", "reference": "[Page 633]"}, {"type": "mc", "stem": "What is the \"Closure\" of a set of attributes X (denoted X + )?", "options": ["The set of all attributes that X can determine via functional dependencies.", "The set of all keys in the relation.", "The minimum number of attributes required to form a key.", "The set of all rows that share the same X value."], "correct": "A", "reference": "[Page 611]"}, {"type": "mc", "stem": "You are given a relation R ( A , B , C , D , E ) R(A, B, C, D, E) R ( A , B , C , D , E ) with the following functional dependencies: A → B A \\rightarrow B B → C B \\rightarrow C C D → E CD \\rightarrow E C Which of the following is correct regarding the closure of { A , D } \\{A, D\\} and whether it is a candidate key?", "options": ["{ A , D } + = { A , B , D } \\{A, D\\}^+ = \\{A, B, D\\} ; not a candidate key", "{ A , D } + = { A , B , C , D } \\{A, D\\}^+ = \\{A, B, C, D\\} ; not a candidate key", "{ A , D } + = { A , B , C , D , E } \\{A, D\\}^+ = \\{A, B, C, D, E\\} ; it is a candidate key", "{ A , D } + = { A , D , E } \\{A, D\\}^+ = \\{A, D, E\\} ; it is a candidate key"], "correct": "C", "reference": null}, {"type": "tf", "stem": "An unordered file, or heap file, supports efficient retrieval of all records but does not optimize searches based on specific field values like an index does.", "correct": "True", "reference": "Page 276"}, {"type": "tf", "stem": "An index using Alternative (2) or (3) for its data entries can only be a clustered index if the underlying data records are physically sorted on the search key field.", "correct": "True", "reference": "Page 277"}, {"type": "tf", "stem": "An index utilizing Alternative (1) is sometimes referred to as a clustered file because the data entries in the index are the actual data records themselves.", "correct": "True", "reference": "Page 277"}, {"type": "tf", "stem": "A primary index is an index on a set of fields that includes the primary key, and it is guaranteed not to contain duplicate data entries.", "correct": "True", "reference": "Page 278"}, {"type": "tf", "stem": "Hash-based index structures are highly effective for evaluating range selection queries without needing to scan the entire file.", "correct": "False", "reference": "Page 290"}, {"type": "tf", "stem": "In a B+ tree index, the number of disk I/Os incurred during a search is strictly equal to the length of the path from the root to a leaf, regardless of how many qualifying data entries there are.", "correct": "False", "reference": "Page 281"}, {"type": "tf", "stem": "Inserting a record into a sorted file is generally an inexpensive operation because records are simply appended to the last page of the file.", "correct": "False", "reference": "Page 286"}, {"type": "tf", "stem": "To evaluate a query that retrieves all records in sorted order, it is always more efficient in terms of I/O to use an unclustered tree index rather than sorting the entire data file directly.", "correct": "False", "reference": "Page 288"}, {"type": "tf", "stem": "An index-only evaluation strategy works equally efficiently with unclustered indexes as it does with clustered indexes, because the query is answered solely using the data entries in the index.", "correct": "True", "reference": "Page 293"}, {"type": "tf", "stem": "A composite tree index with the search key (age, sal) will perform efficiently for an equality search on sal alone, even if the age field is left unspecified.", "correct": "False", "reference": "Page 296"}, {"type": "tf", "stem": "The database management system (DBMS) assumes the responsibility of ensuring that a single transaction, run by itself, preserves the consistency of the database.", "correct": "False", "reference": "Page 521"}, {"type": "tf", "stem": "The DBMS recovery manager relies on a log of all writes to the database to ensure both the atomicity and the durability of transactions.", "correct": "True", "reference": "Page 522"}, {"type": "tf", "stem": "A serializable schedule guarantees that the interleaved execution of a set of transactions results in a database state that is identical to executing those transactions in any possible serial order.", "correct": "True", "reference": "Page 525"}, {"type": "tf", "stem": "An unrepeatable read anomaly occurs when a transaction overwrites the value of an object that has already been modified by another uncommitted transaction.", "correct": "False", "reference": "Page 528"}, {"type": "tf", "stem": "A schedule is considered recoverable if transactions commit only after all transactions whose changes they have read successfully commit.", "correct": "True", "reference": "Page 530"}, {"type": "tf", "stem": "Under the Strict Two-Phase Locking (Strict 2PL) protocol, a transaction can release its shared locks as soon as it finishes reading an object, while holding its exclusive locks until completion.", "correct": "False", "reference": "Page 531"}, {"type": "tf", "stem": "Thrashing in a database system primarily occurs because the overhead of aborting and restarting deadlocked transactions exceeds the system's processing capacity.", "correct": "False", "reference": "Page 534"}, {"type": "tf", "stem": "The phantom problem cannot be entirely prevented by merely setting row-level shared locks on all currently existing rows that satisfy a query's selection predicate.", "correct": "True", "reference": "Pages 537-538"}, {"type": "tf", "stem": "A transaction running at the READ COMMITTED isolation level is protected against dirty reads, but it may still experience unrepeatable reads and phantoms.", "correct": "True", "reference": "Pages 539-540"}, {"type": "tf", "stem": "A buffer manager using a \"steal\" approach allows the changes made to an object in the buffer pool by an uncommitted transaction to be written to disk.", "correct": "True", "reference": "Page 541"}, {"type": "tf", "stem": "The use of null values provides a complete and general solution to the insertion and deletion anomalies that arise from redundancy in a relational schema.", "correct": "False", "reference": "Page 608"}, {"type": "tf", "stem": "The Augmentation rule in Armstrong’s Axioms states that if X → Y and Y → Z, then X → Z.", "correct": "False", "reference": "Page 612"}, {"type": "tf", "stem": "In a Boyce-Codd Normal Form (BCNF) relation schema, if there is a non-trivial functional dependency X → A, then X must be a superkey.", "correct": "True", "reference": "Pages 615-616"}, {"type": "tf", "stem": "A relation schema in Third Normal Form (3NF) may still contain partial or transitive dependencies if the dependent attribute is a part of some candidate key.", "correct": "True", "reference": "Page 617"}, {"type": "tf", "stem": "Every decomposition used to eliminate redundancy in a database design must possess the lossless-join property to ensure no information is lost.", "correct": "True", "reference": "Page 619"}, {"type": "tf", "stem": "A decomposition is considered dependency-preserving if the closure of the union of the functional dependencies projected onto the decomposed relations equals the closure of the original functional dependencies.", "correct": "True", "reference": "Page 621"}, {"type": "tf", "stem": "It is always mathematically possible to decompose a relation schema into a collection of BCNF relation schemas such that the decomposition is both lossless-join and dependency-preserving.", "correct": "False", "reference": "Page 622"}, {"type": "tf", "stem": "When computing a minimal cover for a set of functional dependencies, the order in which redundant functional dependencies are evaluated and deleted does not affect the resulting minimal cover.", "correct": "False", "reference": "Page 626"}, {"type": "tf", "stem": "A multivalued dependency X →→ Y asserts that for a given X value, the associated set of Y values is entirely independent of the values in the rest of the attributes in the relation.", "correct": "True", "reference": "Page 635"}, {"type": "tf", "stem": "If a relation schema is in BCNF and at least one of its keys consists of a single attribute, the relation is guaranteed to also be in Fourth Normal Form (4NF).", "correct": "True", "reference": "Page 637"}, {"type": "essay", "prompt": "If you were about to create an index on a relation, what considerations would guide your choice? Discuss: 1. The choice of primary index. 2. Clustered versus unclustered indexes. 3. Hash versus tree indexes. 4. The use of a sorted file rather than a tree-based index. 5. Choice of search key for the index. What is a composite search key, and what considerations are made in choosing composite search keys? What are index-only plans, and what is the influence of potential index-only evaluation plans on the choice of search key for an index?", "answer": "1. The choice of the primary key is made based on the semantics of the data. If we need to retrieve records based on the value of the primary key, as is likely, we should build an index using this as the search key. If we need to retrieve records based on the values of fields that do not constitute the primary key, we build (by definition) a secondary index using (the combination of) these fields as the search key. 2. A clustered index offers much better range query performance, but essentially the same equality search performance (modulo duplicates) as an unclustered index. Further, a clustered index is typically more expensive to maintain than an unclustered index. Therefore, we should make an index be clustered only if range queries are important on its search key. At most one of the indexes on a relation can be clustered, and if range queries are anticipated on more than one combination of fields, we have to choose the combination that is most important and make that be the search key of the clustered index. 3. If it is likely that ranged queries are going to be performed often, then we should use a B+-tree on the index for the relation since hash indexes cannot perform range queries. If it is more likely that we are only going to perform equality queries, for example the case of social security numbers, than hash indexes are the best choice since they allow for the faster retrieval than B+-trees by 2-3 I/Os per request. 4. First of all, both sorted files and tree-based indexes offer fast searches. Insertions and deletions, though, are much faster for tree-based indexes than sorted files. On the other hand scans and range searches with many matches are much faster for sorted files than tree-based indexes. Therefore, if we have read-only data that is not going to be modified often, it is better to go with a sorted file, whereas if we have data that we intend to modify often, then we should go with a tree-based index. 5. A composite search key is a key that contains several fields. A composite search key can support a broader range as well as increase the possibility for an indexonly plan, but are more costly to maintain and store. An index-only plan is query evaluation plan where we only need to access the indexes for the data records, and not the data records themselves, in order to answer the query. Obviously, indexonly plans are much faster than regular plans since it does not require reading of the data records. If it is likely that we are going to performing certain operations repeatly that only require accessing one field, for example the average value of a field, it would be an advantage to create a search key on this field since we could then accomplish it with an index-only plan."}, {"type": "essay", "prompt": "Consider the following relations: Emp( eid: integer , ename: varchar, sal: integer, age: integer, did: integer) Dept( did: integer , budget: integer, floor: integer, mgr eid: integer) Salaries range from $10,000 to $100,000, ages vary from 20 to 80, each department has about five employees on average, there are 10 floors, and budgets vary from $10,000 to $1 million. You can assume uniform distributions of values. For each of the following queries, which of the listed index choices would you choose to speed up the query? If your database system does not consider index-only plans (i.e., data records are always retrieved even if enough information is available in the index entry), how would your answer change? Explain briefly. 1. Query: Print ename, age, and sal for all employees. (a) Clustered hash index on <ename, age, sal> fields of Emp. (b) Unclustered hash index on <ename, age, sal> fields of Emp. (c) Clustered B+ tree index on <ename, age, sal> fields of Emp. d) Unclustered hash index on <eid, did> fields of Emp. (e) No index. 2. Query: Find the dids of departments that are on the 10th floor and have a budget of less than $15,000. (a) Clustered hash index on the floor field of Dept. (b) Unclustered hash index on the floor field of Dept. (c) Clustered B+ tree index on <floor, budget> fields of Dept. (d) Clustered B+ tree index on the budget field of Dept. (e) No index.", "answer": "1. We should create an unclustered hash index on ename, age, sal fields of Emp (b) since then we could do an index only scan. If our system does not include index only plans then we shouldn’t create an index for this query (e). Since this query requires us to access all the Emp records, an index won’t help us any, and so should we access the records using a filescan. 2. We should create a clustered dense B+ tree index (c) on floor, budget fields of Dept, since the records would be ordered on these fields then. So when executing this query, the first record with floor = 10 must be retrieved, and then the other records with floor = 10 can be read in order of budget. Note that this plan, which is the best for this query, is not an index-only plan (must look up dids)."}, {"type": "essay", "prompt": "Consider the following relation: Emp( eid: integer , sal: integer, age: real, did: integer) There is a clustered index on eid and an unclustered index on age. 1. How would you use the indexes to enforce the constraint that eid is a key? 2. Give an example of an update that is definitely speeded up because of the available indexes. (English description is sufficient.) 3. Give an example of an update that is definitely slowed down because of the indexes. (English description is sufficient.) 4. Can you give an example of an update that is neither speeded up nor slowed down by the indexes?", "answer": "1. Enforcing the key constraint on eid Since there is a clustered index on eid, the DBMS can enforce the key constraint (uniqueness) as follows: When inserting a new tuple, the system searches the clustered index for the given eid. If the value already exists, the insertion is rejected. Because the index is ordered and efficient (B+ Tree), this check is fast. Thus, the clustered index ensures that no duplicate eid values are inserted. 2. Example of an update that is speeded up An update that benefits from the indexes is one that uses an indexed attribute in the search condition. Example: “Increase salary by 10% for employees with age > 50.” The unclustered index on age allows the DBMS to quickly find qualifying tuples. Without the index, it would require a full table scan. So, this update is faster due to the index on age. 3. Example of an update that is slowed down An update that modifies an indexed attribute is slowed down due to index maintenance. Example: “Increase the age of all employees by 1.” Since age is indexed (unclustered index), every update requires: Updating the index entries Possibly reorganizing index structure This adds overhead, so the update is slower. 4. Example of an update that is neither speeded up nor slowed down An update that: Does not use an index for selection, and Does not modify indexed attributes Example: “Increase sal by 5% for all employees.” No index is used to locate tuples (full scan needed anyway) sal is not indexed, so no index maintenance is required Therefore, the indexes have no effect on performance."}, {"type": "essay", "prompt": "Consider two transactions (T1) and (T2) operating on data item (X). The following schedules illustrate different types of concurrency conflicts: T2: R(X),; T2: R(Y),; T2: W(X),; T1: R(X) T2: R(X),; T2: R(Y),; T1: R(X),; T1: R(Y),; T1: W(X) T2: R(X),; T2: R(Y),; T1: R(X),; T1: R(Y),; T1: W(X),; T2: W(X) Explain how Strict 2PL prevents each of the above conflicts: dirty read unrepeatable read lost update In your answer, describe the locking behavior that enforces correctness.", "answer": "(1) Write–Read Conflict (Dirty Read) Schedule: T2: R(X),; T2: R(Y),; T2: W(X),; T1: R(X) (T1) reads (X) after (T2) has written it but before (T2) commits This is a dirty read (write–read conflict) Problem: if (T2) aborts, (T1) has used invalid data (2) Read–Write Conflict (Unrepeatable Read) Schedule: T2: R(X),; T2: R(Y),; T1: R(X),; T1: R(Y),; T1: W(X) (T2) reads (X), then (T1) modifies (X) If (T2) reads (X) again, it may see a different value This is an unrepeatable read (read–write conflict) (3) Write–Write Conflict (Lost Update) Schedule: T2: R(X),; T2: R(Y),; T1: R(X),; T1: R(Y),; T1: W(X),; T2: W(X) (T1) updates (X), but later (T2) overwrites it (T2) does not see (T1)'s update This is a lost update (write–write conflict) Strict 2PL and Conflict Prevention Strict Two-Phase Locking enforces the rule: A transaction holds all its exclusive locks until it commits or aborts. How it prevents conflicts: (a) Dirty Read Prevention If (T2) holds an exclusive lock on (X) after writing it (T1) cannot read (X) (T1) must wait until (T2) commits prevents reading uncommitted data (b) Unrepeatable Read Prevention If (T2) holds a shared or exclusive lock on (X) (T1) cannot acquire a conflicting lock to modify (X) ensures read consistency during execution (c) Lost Update Prevention (T2) cannot overwrite (X) if (T1) still holds a lock Access is serialized through locking prevents write–write interference Conclusion Strict 2PL guarantees: No dirty reads No unrepeatable reads No lost updates because locks are held until commit, forcing a safe serial-like execution order."}, {"type": "essay", "prompt": "Consider the following university enrollment database schema: Student ( snum: integer , sname: string, major: string, level: string, age: integer) Class ( name: string , meets_at: time, room: string, fid: integer) Enrolled ( snum: integer, cname: string ) Faculty ( fid: intege r, fname: string, deptid: integer) The relation Enrolled contains one record per student–class pair indicating enrollment. For each of the following transactions, select an appropriate SQL isolation level and briefly justify your choice. Questions A student (identified by snum ) enrolls in the class “Introduction to Database Systems” . A student (identified by snum ) changes enrollment from one class to another. A faculty member (identified by fid ) is assigned to the class with the fewest enrolled students . For each class, compute and display the number of enrolled students.", "answer": "1. Student Enrollment Transaction This transaction inserts a new tuple into the relation Enrolled . It does not depend on existing rows, and no consistency read is required. Isolation Level: READ UNCOMMITTED Reason: No need for strict consistency because no existing data is being read or modified; only an insert operation is performed. 2. Changing Student Enrollment This transaction updates an existing row in Enrolled (remove old enrollment and add a new one or update entry). It requires safe modification of a specific tuple. Isolation Level: READ COMMITTED Reason: Ensures that only committed data is read and avoids dirty reads while updating existing records. 3. Assign Faculty to Class with Fewest Students This requires reading the  Enrolled table to compute class sizes. Concurrent inserts/updates could change results while the query is executing (phantom problem). Isolation Level: SERIALIZABLE Reason: Prevents phantom reads by ensuring no other transaction can insert or modify relevant rows during execution, guaranteeing correct class selection. 4. Count Students per Class This is a aggregate query over Enrolled. It scans multiple rows and is affected by concurrent insertions/deletions. Isolation Level: SERIALIZABLE Reason: Ensures consistent results by preventing phantom tuples and concurrent modifications during aggregation."}, {"type": "essay", "prompt": "Consider the following database schema: Suppliers ( sid: integer , sname: string, address: string) Parts (pid: integer , pname: string, color: string) Catalog ( sid: integer, pid: integer , cost: real) The relation Catalog stores the prices at which suppliers sell parts. Two transactions, T 1 T1 and T 2 T2 , are executed concurrently. Transaction T 1 T1 always runs at isolation level SERIALIZABLE . For each of the following cases: SERIALIZABLE vs. REPEATABLE READ", "answer": "Sample Database Instance (Catalog) sid pid cost 18 45 7.05 22 98 89.35 31 52 357.65 31 53 26.22 58 15 37.50 58 94 26.22 Transaction T 1 T1 : SELECT * FROM Catalog C WHERE C.cost < 100 EXCEPT SELECT * FROM Catalog C WHERE C.cost < 100 ; Transaction T 2 T2 : INSERT INTO Catalog (sid, pid, cost) VALUES ( 99 , 38 , 75.25 ); Schedule (Interleaving) T 1 T1 : executes first SELECT T 2 T2 : inserts a new tuple with cost < 100 T 1 T1 : executes second SELECT E xplanation Under SERIALIZABLE: T 1 T1 sees a consistent snapshot Both SELECT queries return identical results Final result is empty Under REPEATABLE READ: Phantom rows may appear The inserted tuple by T 2 T2 may appear in the second SELECT Result becomes non-empty This is the phantom read problem"}, {"type": "essay", "prompt": "Suppose you are given a relation R with four attributes ABCD. For each of the following sets of FDs, assuming those are the only dependencies that hold for R, do the following: (a) Identify the candidate key(s) for R. (b) Identify the best normal form that R satisfies (1NF, 2NF, 3NF, or BCNF). (c) If R is not in BCNF, decompose it into a set of BCNF relations that preserve the dependencies. 1. C → D, C → A, B → C 2. B → C, D → A 3. ABC → D, D → A 4. A → B, BC → D, A → C 5. AB → C, AB → D, C → A, D → B", "answer": "1. (a) Candidate keys: B (b) R is in 2NF but not 3NF. (c) C → D and C → A both cause violations of BCNF. One way to obtain a (lossless) join preserving decomposition is to decompose R into AC, BC, and CD. 2. (a) Candidate keys: BD (b) R is in 1NF but not 2NF. (c) Both B → C and D → A cause BCNF violations. The decomposition: AD, BC, BD (obtained by first decomposing to AD, BCD) is BCNF and lossless and join-preserving. 3. (a) Candidate keys: ABC, BCD (b) R is in 3NF but not BCNF. (c) ABCD is not in BCNF since D → A and D is not a key. However if we split up R as AD, BCD we cannot preserve the dependency ABC → D. So there is no BCNF decomposition. 4. (a) Candidate keys: A (b) R is in 2NF but not 3NF (because of the FD: BC → D). (c) BC → D violates BCNF since BC does not contain a key. So we split up R as in: BCD, ABC. 5. (a) Candidate keys: AB, BC, CD, AD (b) R is in 3NF but not BCNF (because of the FD: C → A). (c) C → A and D → B both cause violations. So decompose into: AC, BCD but this does not preserve AB → C and AB → D, and BCD is still not BCNF because D → B. So we need to decompose further into: AC, BD, CD. However, when we attempt to revive the lost functioanl dependencies by adding ABC and ABD, we that these relations are not in BCNF form. Therefore, there is no BCNF decomposition."}];

const root = document.getElementById('questions');
const state = { revealed: {}, answers: {}, filter: 'all', order: QUESTIONS.map((_, i) => i) };

function letter(i) { return String.fromCharCode(65 + i); }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  root.innerHTML = '';
  let mcN = 0, tfN = 0, esN = 0;
  let lastType = null;
  for (const idx of state.order) {
    const q = QUESTIONS[idx];
    if (state.filter !== 'all' && q.type !== state.filter) continue;
    if (q.type !== lastType) {
      const h = document.createElement('div');
      h.className = 'section-header';
      h.textContent = ({mc:'Multiple Choice', tf:'True / False', essay:'Long-answer / Essay'})[q.type];
      root.appendChild(h);
      lastType = q.type;
    }
    let num;
    if (q.type === 'mc') num = ++mcN;
    else if (q.type === 'tf') num = ++tfN;
    else num = ++esN;
    const card = document.createElement('div');
    card.className = 'q';
    card.dataset.idx = idx;
    card.id = 'q-' + idx;

    const head = document.createElement('div');
    head.className = 'q-head';
    head.innerHTML = `<span class="q-num">#${num}</span><span class="q-type">${({mc:'Multiple Choice',tf:'True / False',essay:'Essay'})[q.type]}</span>`;
    card.appendChild(head);

    const stem = document.createElement('div');
    stem.className = 'q-stem';
    stem.innerHTML = escapeHtml(q.type === 'essay' ? q.prompt : q.stem);
    card.appendChild(stem);

    if (q.type === 'mc') {
      const opts = document.createElement('div');
      opts.className = 'options';
      q.options.forEach((opt, i) => {
        const L = letter(i);
        const id = `q${idx}-${L}`;
        const lab = document.createElement('label');
        lab.className = 'opt';
        lab.dataset.letter = L;
        lab.innerHTML = `
          <input type="radio" name="q${idx}" value="${L}" id="${id}" ${state.answers[idx]===L?'checked':''}>
          <span class="opt-letter">${L})</span>
          <span class="opt-text">${escapeHtml(opt)}</span>`;
        lab.querySelector('input').addEventListener('change', e => {
          state.answers[idx] = e.target.value;
          updateProgress();
        });
        opts.appendChild(lab);
      });
      card.appendChild(opts);
    } else if (q.type === 'tf') {
      const opts = document.createElement('div');
      opts.className = 'options';
      ['True','False'].forEach(v => {
        const lab = document.createElement('label');
        lab.className = 'opt';
        lab.dataset.letter = v;
        lab.innerHTML = `
          <input type="radio" name="q${idx}" value="${v}" ${state.answers[idx]===v?'checked':''}>
          <span class="opt-letter">${v[0]}</span>
          <span class="opt-text">${v}</span>`;
        lab.querySelector('input').addEventListener('change', e => {
          state.answers[idx] = e.target.value;
          updateProgress();
        });
        opts.appendChild(lab);
      });
      card.appendChild(opts);
    } else {
      const ta = document.createElement('textarea');
      ta.placeholder = 'Type your answer here...';
      ta.value = state.answers[idx] || '';
      ta.addEventListener('input', e => { state.answers[idx] = e.target.value; updateProgress(); });
      card.appendChild(ta);
    }

    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.innerHTML = `
      <button class="btn btn-primary" onclick="showAnswer(${idx})">Show answer</button>
      <button class="btn" onclick="hideAnswer(${idx})">Hide</button>
      ${q.type !== 'essay' ? `<button class="btn btn-good" onclick="checkOne(${idx})">Check mine</button>` : ''}
    `;
    card.appendChild(actions);

    const fb = document.createElement('div');
    fb.className = 'feedback';
    fb.id = 'fb-' + idx;
    card.appendChild(fb);

    const ans = document.createElement('div');
    ans.className = 'answer-box' + (state.revealed[idx] ? ' show' : '');
    ans.id = 'ans-' + idx;
    let body = '';
    if (q.type === 'mc') {
      const ci = q.correct.charCodeAt(0) - 65;
      body = `<div class="label">Correct answer</div><b>${q.correct})</b> ${escapeHtml(q.options[ci] || '')}`;
      if (q.reference) body += `<div class="ref">Reference: ${escapeHtml(q.reference)}</div>`;
    } else if (q.type === 'tf') {
      body = `<div class="label">Correct answer</div><b>${q.correct}</b>`;
      if (q.reference) body += `<div class="ref">Reference: ${escapeHtml(q.reference)}</div>`;
    } else {
      body = `<div class="label">Model answer</div>${escapeHtml(q.answer)}`;
    }
    ans.innerHTML = body;
    card.appendChild(ans);

    root.appendChild(card);
  }
  updateCounts();
  if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([root]);
}

function showAnswer(idx) {
  state.revealed[idx] = true;
  document.getElementById('ans-' + idx).classList.add('show');
}
function hideAnswer(idx) {
  state.revealed[idx] = false;
  document.getElementById('ans-' + idx).classList.remove('show');
}
function checkOne(idx) {
  const q = QUESTIONS[idx];
  const card = document.getElementById('q-' + idx);
  const fb = document.getElementById('fb-' + idx);
  card.classList.remove('correct','incorrect');
  card.querySelectorAll('.opt').forEach(o => o.classList.remove('correct','wrong'));
  const user = state.answers[idx];
  if (!user) { fb.className = 'feedback bad'; fb.textContent = 'No answer selected.'; return; }
  const correct = q.correct;
  const ok = user.toLowerCase() === correct.toLowerCase();
  card.classList.add(ok ? 'correct' : 'incorrect');
  fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
  fb.textContent = ok ? '✓ Correct' : `✗ Incorrect — correct answer is ${correct}`;
  card.querySelectorAll('.opt').forEach(o => {
    if (o.dataset.letter === correct) o.classList.add('correct');
    else if (o.dataset.letter === user) o.classList.add('wrong');
  });
  showAnswer(idx);
}
function gradeAll() {
  let total = 0, right = 0, ungraded = 0;
  QUESTIONS.forEach((q, idx) => {
    if (q.type === 'essay') return;
    total++;
    if (!state.answers[idx]) { ungraded++; return; }
    if (state.answers[idx].toLowerCase() === q.correct.toLowerCase()) right++;
    checkOne(idx);
  });
  const pct = total ? Math.round(right/total*100) : 0;
  document.getElementById('score').textContent =
    `Score: ${right} / ${total} (${pct}%) — ${ungraded} unanswered. Essays must be self-graded against the model answer.`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function revealAll() { QUESTIONS.forEach((_, idx) => showAnswer(idx)); }
function hideAll()   { QUESTIONS.forEach((_, idx) => hideAnswer(idx)); }
function resetAll() {
  if (!confirm('Reset all your answers and revealed solutions?')) return;
  state.answers = {}; state.revealed = {};
  document.getElementById('score').textContent = '';
  render();
}
function shuffle() {
  // Shuffle within each type group to keep section ordering
  const groups = { mc: [], tf: [], essay: [] };
  QUESTIONS.forEach((q, i) => groups[q.type].push(i));
  for (const k in groups) {
    const a = groups[k];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
  }
  state.order = [...groups.mc, ...groups.tf, ...groups.essay];
  render();
}
function updateProgress() {
  const answerable = QUESTIONS.filter(q => q.type !== 'essay').length;
  const answered = Object.keys(state.answers).filter(k => QUESTIONS[k].type !== 'essay' && state.answers[k]).length;
  document.getElementById('progressBar').style.width = (answered/answerable*100) + '%';
}
function updateCounts() {
  const mc = QUESTIONS.filter(q => q.type==='mc').length;
  const tf = QUESTIONS.filter(q => q.type==='tf').length;
  const es = QUESTIONS.filter(q => q.type==='essay').length;
  document.getElementById('counts').textContent = `${QUESTIONS.length} questions • ${mc} MC • ${tf} T/F • ${es} essay`;
}

document.querySelectorAll('.filter-chip').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    state.filter = el.dataset.filter;
    render();
  });
});
document.getElementById('shuffleBtn').addEventListener('click', shuffle);
document.getElementById('resetBtn').addEventListener('click', resetAll);
document.getElementById('gradeBtn').addEventListener('click', gradeAll);

render();
updateProgress();
</script>
</body>
</html>
